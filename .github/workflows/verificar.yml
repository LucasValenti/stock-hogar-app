# Corre lo mismo que `npm run verificar` en cada push a main y en cada pull request:
# lint, tipos, tests, build, pruebas de la base (PGlite, nunca Supabase) y auditoría de dependencias.
name: Verificar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Acciones fijadas por commit (Dependabot las mantiene al día).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # .npmrc trae ignore-scripts=true: ningún paquete corre scripts al instalarse.
      - run: npm ci
      - run: npm run verificar

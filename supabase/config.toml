# Configuración de la CLI de Supabase para este repo. Solo lo que usan las Edge Functions.
# project_id es un nombre local (no es el id del proyecto en Supabase).
project_id = "stock-hogar-app"

# La llama solo el cron de los domingos (migración 009), que se identifica con la cabecera x-cron-secret.
# Sin esto, el gateway de Supabase pide un JWT y rechaza al cron antes de llegar a la función.
# Con la CLI (`npx supabase functions deploy resumen-semanal`) toma esto solo. Desde el editor del panel, pegar
# el archivo de `npm run empaquetar:funcion` y apagar «Verify JWT» en la función.
[functions.resumen-semanal]
verify_jwt = false
